[package]
name = "livewalk-desktop"
description = "Live Code Walk & Analysis desktop app: a thin Tauri v2 shell over lcw-engine."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Live Code Walk contributors"]
rust-version = "1.82"
default-run = "livewalk-desktop"

# Not a workspace member: the desktop app has its own build flow (Tauri bundler
# for this backend + Trunk/wasm for the frontend), kept separate so the core
# workspace stays fast and GPU/webview-free.

[lib]
# The app logic lives in a lib so a future mobile target (and integration tests)
# can reuse it; the binary is a thin `main` that calls `run()`.
name = "livewalk_desktop_lib"
crate-type = ["lib"]

[features]
default = []
# Precise (rust-analyzer) semantic adapter. Heavy; opt-in.
semantic = ["lcw-engine/semantic"]
# GPU-compute graph layout (wgpu). Falls back to CPU if no adapter is present.
gpu = ["lcw-layout/gpu"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The engine and the shared domain types. The UI depends *only* on the engine
# facade (Principle I), never on individual analysis layers.
lcw-core = { path = "../../../crates/lcw-core" }
lcw-config = { path = "../../../crates/lcw-config" }
lcw-engine = { path = "../../../crates/lcw-engine" }
lcw-layout = { path = "../../../crates/lcw-layout" }
