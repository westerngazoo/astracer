[package]
name = "lcw-render"
description = "Live Code Walk: surface-agnostic wgpu renderer for the call graph."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
font8x8 = "0.3.1"
glam = { version = "0.33.7", features = ["bytemuck"] }
lcw-core = { path = "../lcw-core" }
lcw-query = { path = "../lcw-query" }
lcw-telemetry = { path = "../lcw-telemetry" }
png = { version = "0.17.16", optional = true }
pollster = { version = "1.0.1", optional = true }
thiserror = "2.0.20"
wgpu = "24.0.5"
winit = { version = "0.30.13", optional = true }

# wasm target: create a wgpu surface from an HTML <canvas> for the Tauri
# webview (and a future VS Code webview).
#
# `webgl` compiles wgpu's WebGL2 backend into the wasm build. Without it the
# only web backend is WebGPU, so every webview that lacks WebGPU — notably
# WebKitGTK, which is what Tauri embeds on Linux — fails with "no compatible
# GPU adapter" and shows an empty canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Attr",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "NamedNodeMap",
    "Navigator",
    "Node",
    "Window",
] }
wgpu = { version = "24.0.5", features = ["webgl"] }

[features]
# Native winit+wgpu driver (desktop validation / "power mode"). The renderer
# core is surface-agnostic and also compiles to wasm without this feature.
default = ["native"]
native = ["dep:winit", "dep:pollster", "dep:png"]
