[package]
name = "lcw-adapter-ts"
description = "Live Code Walk: Layer 1 TypeScript parser (tree-sitter + heuristic resolution)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lcw-core = { path = "../lcw-core" }
tree-sitter = "0.26.13"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
# Lean setup: skip plotters/HTML reports, keep `cargo bench` support.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.48.0", features = ["json"] }
serde_json = "1.0.151"

[[bench]]
name = "parse"
harness = false
