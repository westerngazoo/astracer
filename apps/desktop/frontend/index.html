<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Code Walk &amp; Analysis</title>
    <link data-trunk rel="rust" />
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --panel-2: #1c232d;
        --panel-3: #232b37;
        --border: #2a323d;
        --text: #c9d3df;
        --muted: #8b97a6;
        --accent: #4c8cf2;
        --accent-2: #40bfb8;
        --amber: #f2c94c;
        --orange: #ff9450;
        --danger: #e5534b;
        --fn: rgb(76, 140, 242);
        --method: rgb(64, 191, 184);
        --closure: rgb(158, 115, 230);
        --external: rgb(115, 115, 128);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --explorer-w: 320px;
        --side-w: 380px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
        overflow: hidden;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ---- toolbar ------------------------------------------------------ */

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.2px;
        margin-right: 6px;
        white-space: nowrap;
      }

      .toolbar .path {
        flex: 1;
        min-width: 120px;
        padding: 8px 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: var(--mono);
      }

      .toolbar .path:focus {
        outline: none;
        border-color: var(--accent);
      }

      .search {
        width: 160px;
        flex-shrink: 0;
        padding: 8px 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: var(--mono);
      }

      .search:focus {
        outline: none;
        border-color: var(--accent-2);
      }

      .toolbar .mode {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        user-select: none;
      }

      .toolbar .mode.disabled {
        opacity: 0.5;
        cursor: default;
      }

      button {
        padding: 8px 14px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      button.small {
        padding: 3px 8px;
        font-size: 12px;
        border-radius: 6px;
      }

      /* ---- three columns: explorer | stage | side ------------------------ */

      .body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .body.panel-resizing {
        cursor: col-resize;
        user-select: none;
      }

      .body.panel-resizing .stage canvas.graph {
        pointer-events: none;
      }

      .splitter {
        flex-shrink: 0;
        width: 5px;
        margin: 0 -1px;
        position: relative;
        z-index: 3;
        cursor: col-resize;
        touch-action: none;
        background: transparent;
        transition: background 0.12s ease;
      }

      .splitter::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        transform: translateX(-50%);
        background: var(--border);
        pointer-events: none;
      }

      .splitter:hover,
      .body.panel-resizing .splitter.active {
        background: rgba(76, 140, 242, 0.12);
      }

      .splitter:hover::after,
      .body.panel-resizing .splitter.active::after {
        background: rgba(76, 140, 242, 0.55);
      }

      .explorer {
        width: var(--explorer-w);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 12px;
        gap: 12px;
        background: var(--panel);
        border-right: 1px solid var(--border);
      }

      .explorer .card {
        margin-bottom: 0;
      }

      /* Three views, one visible at a time: each gets the full height of the
         column instead of sharing it three ways. */
      .tabs {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }

      .tabs .tab {
        flex: 1;
        padding: 6px 4px;
        font-size: 12px;
        border-radius: 7px;
      }

      .tabs .tab.active {
        color: #fff;
        border-color: var(--accent);
        background: rgba(76, 140, 242, 0.22);
      }

      .explorer .card.entries {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .explorer .card.outline,
      .explorer .card.run {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .outline-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .outline-head h3 {
        margin: 0 0 6px;
      }

      .outline-tools {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }

      .outline-tools .search {
        flex: 1;
        width: auto;
        min-width: 0;
        padding: 5px 8px;
        font-size: 12px;
      }

      .tree {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        font-family: var(--mono);
        font-size: 12px;
        margin: 0 -6px;
      }

      .stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      canvas.graph {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: radial-gradient(circle at 50% 40%, #12171e 0%, #0b0e13 100%);
      }

      /* Node label overlay: projected spans that never eat pointer events. */
      .labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .group-label {
        position: absolute;
        box-sizing: border-box;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
        color: #f4f7fb;
        font-family: var(--mono);
        font-weight: 600;
        line-height: 1;
        margin: 6px 0 0 6px;
        padding: 3px 6px;
        border-left: 3px solid transparent;
        border-radius: 3px;
        background: rgba(9, 12, 18, 0.72);
      }
      .node-label {
        position: absolute;
        transform: translate(-50%, -150%);
        white-space: nowrap;
        pointer-events: none;
        color: #e4ebf5;
        font-family: var(--mono);
        line-height: 1;
        padding: 1px 3px;
        border-radius: 4px;
        background: rgba(9, 12, 18, 0.55);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      }

      canvas.minimap {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 200px;
        height: 136px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(9, 12, 18, 0.9);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        cursor: crosshair;
      }

      .side {
        width: var(--side-w);
        flex-shrink: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 14px;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--border);
      }

      /* ---- cards ----------------------------------------------------------- */

      .card {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 14px;
      }

      .card.detail {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        margin-bottom: 14px;
      }

      .card.detail .detail-head,
      .card.detail .qname,
      .card.detail .meta,
      .card.detail .flags,
      .card.detail .detail-tabs {
        flex-shrink: 0;
      }

      .detail-details,
      .detail-flow-pane,
      .detail-code {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .card h4 {
        margin: 14px 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .qname {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--accent-2);
        word-break: break-all;
        margin-bottom: 4px;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        font-family: var(--mono);
        margin-bottom: 8px;
        /* Keep the badge on the line: the path ellipsizes instead of wrapping
           (the full location is in the element's title). */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta .badge {
        margin-left: auto;
      }

      ul.stats {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      ul.stats li {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px dashed var(--border);
      }

      ul.stats li:last-child {
        border-bottom: none;
      }

      ul.stats span {
        color: var(--muted);
      }

      ul.stats b {
        font-variant-numeric: tabular-nums;
      }

      ul.stats.compact {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 14px;
        font-size: 12.5px;
      }

      .flags {
        margin: 0 0 8px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
      }

      /* ---- explorer rows ---------------------------------------------------- */

      .group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 8px 0 2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .group:first-child {
        margin-top: 0;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 6px;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        user-select: none;
      }

      .row:hover {
        background: var(--panel-3);
      }

      .row.selected {
        background: rgba(76, 140, 242, 0.22);
        outline: 1px solid rgba(76, 140, 242, 0.6);
      }

      .row .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row.scope .label {
        color: #dfe7f2;
        font-weight: 600;
      }

      .row.fn .label {
        color: var(--text);
      }

      .twisty {
        width: 12px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .count,
      .cc {
        flex-shrink: 0;
        font-size: 10.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .more {
        padding: 2px 8px;
        font-size: 11px;
        color: var(--muted);
        font-style: italic;
      }

      .badge {
        flex-shrink: 0;
        font-size: 9.5px;
        line-height: 1.3;
        padding: 0 5px;
        border-radius: 4px;
        border: 1px solid var(--border);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      .badge.main {
        color: #1a1a1a;
        background: var(--amber);
        border-color: var(--amber);
        font-weight: 700;
      }

      .badge.export {
        color: #1a1a1a;
        background: var(--orange);
        border-color: var(--orange);
        font-weight: 700;
      }

      .badge.pub {
        color: var(--accent-2);
        border-color: var(--accent-2);
      }

      .badge.root {
        color: var(--orange);
        border-color: var(--orange);
      }

      .badge.thread {
        color: #1a1a1a;
        background: var(--accent-2);
        border-color: var(--accent-2);
        font-weight: 700;
      }

      /* Run tree: a root is where control begins; a spawned branch is where a
         new thread does. */
      .row.root .label {
        color: #dfe7f2;
        font-weight: 600;
      }

      .row .via {
        flex-shrink: 0;
        color: var(--amber);
        font-weight: 700;
      }

      .row.spawned .label {
        color: var(--amber);
      }

      .row .recur {
        flex-shrink: 0;
        color: var(--muted);
      }

      .badge.test {
        color: #b9a6f0;
        border-color: #7e64c8;
      }

      .badge.entry {
        color: var(--amber);
        border-color: rgba(242, 201, 76, 0.6);
      }

      /* ---- detail pane: callers/callees, flow, call tree ------------------ */

      .detail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .detail-head h3 {
        margin-bottom: 6px;
      }

      .actions {
        display: flex;
        gap: 4px;
      }

      ul.calls,
      ul.calltree {
        list-style: none;
        margin: 0;
        padding: 0;
        font-family: var(--mono);
        font-size: 12px;
      }

      ul.calls li.call,
      .tree-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 3px 6px;
        border-radius: 5px;
        cursor: pointer;
        overflow: hidden;
      }

      ul.calls li.call:hover,
      .tree-row:hover {
        background: var(--panel-3);
      }

      .call .arrow {
        flex-shrink: 0;
        color: var(--accent);
      }

      .call.ext .arrow,
      .call.ext .name {
        color: var(--external);
      }

      .call.repeat .name {
        color: var(--muted);
      }

      .call .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .call .tag {
        flex-shrink: 0;
        font-size: 10.5px;
        color: var(--muted);
      }

      ul.calltree ul.calltree {
        margin-left: 14px;
        border-left: 1px dashed var(--border);
      }

      .flow {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(242, 201, 76, 0.07);
        border: 1px solid rgba(242, 201, 76, 0.25);
      }

      .flow-head {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .flow-head h4 {
        flex: 1;
        margin: 0;
        color: var(--amber);
      }

      .chain {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.9;
        word-break: break-all;
      }

      .hop {
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(76, 140, 242, 0.18);
        cursor: pointer;
      }

      .hop:hover {
        background: rgba(76, 140, 242, 0.4);
      }

      .sep {
        color: var(--amber);
      }

      .hint.warn {
        color: #e6b673;
      }

      .detail-tabs {
        display: flex;
        gap: 4px;
        margin: 10px 0 8px;
      }

      .detail-tabs .tab {
        flex: 1;
        padding: 5px 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
      }

      .detail-tabs .tab.active {
        color: var(--accent-2);
        border-color: rgba(76, 140, 242, 0.5);
        background: rgba(76, 140, 242, 0.12);
      }

      .detail-flow-pane {
        margin-top: 4px;
      }

      .flow-diagram-wrap {
        overflow-x: auto;
        margin-top: 6px;
        padding-bottom: 8px;
      }

      .flow-svg {
        display: block;
        min-height: 80px;
      }

      .flow-edge {
        stroke: rgba(76, 140, 242, 0.45);
        stroke-width: 1.5;
      }

      .flow-node {
        cursor: pointer;
      }

      .flow-rect {
        fill: var(--panel-2);
        stroke: var(--border);
        stroke-width: 1;
      }

      .flow-node.root .flow-rect {
        stroke: rgba(76, 140, 242, 0.65);
        fill: rgba(76, 140, 242, 0.1);
      }

      .flow-node.ext .flow-rect {
        stroke: var(--external);
      }

      .flow-node.repeat .flow-label {
        color: var(--muted);
      }

      .flow-label {
        font-family: var(--mono);
        font-size: 10px;
        fill: var(--text);
        pointer-events: none;
      }

      .diagram-cap {
        margin-bottom: 4px;
      }

      .code-pane {
        margin-top: 4px;
        min-height: 0;
      }

      .code-head-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .code-head {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .explain-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .explain-provider {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
      }

      .explain-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .explanation-pane {
        margin-top: 10px;
      }

      .explanation-pane h4 {
        margin: 0 0 6px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .explanation-text {
        margin: 0;
        padding: 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        font-family: var(--sans);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        color: var(--text);
      }

      .explain-status {
        margin-top: 8px;
      }

      .code-block {
        margin: 0;
        padding: 8px 0;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .code-line {
        display: flex;
        gap: 10px;
        padding: 0 10px;
        white-space: pre;
      }

      .code-line.hl {
        background: rgba(76, 140, 242, 0.14);
      }

      .code-line .ln {
        flex-shrink: 0;
        width: 3.5em;
        text-align: right;
        color: var(--muted);
        user-select: none;
      }

      .code-line .src {
        flex: 1;
        min-width: 0;
        color: var(--text);
      }

      .code-status {
        margin-top: 8px;
      }

      /* ---- report cards ---------------------------------------------------- */

      ul.list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .sugg {
        padding: 8px 0;
        border-bottom: 1px dashed var(--border);
      }

      .sugg:last-child {
        border-bottom: none;
      }

      .sugg-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .sugg-head b {
        font-size: 13px;
      }

      .prio {
        flex-shrink: 0;
        min-width: 26px;
        text-align: center;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: #fff;
        background: var(--accent);
        border-radius: 6px;
        padding: 1px 4px;
      }

      .sugg-why {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .sugg-tgt {
        margin-top: 4px;
        font-size: 11px;
        color: var(--accent-2);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .diag {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 5px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 12.5px;
      }

      .diag:last-child {
        border-bottom: none;
      }

      .diag .sev {
        flex-shrink: 0;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 1px 5px;
        border-radius: 5px;
        border: 1px solid var(--border);
      }

      .sev-high .sev {
        color: #f0a9a4;
        border-color: var(--danger);
      }
      .sev-medium .sev {
        color: #e6b673;
        border-color: #a9772f;
      }
      .sev-low .sev {
        color: #cdd7e3;
      }
      .sev-info .sev {
        color: var(--accent-2);
        border-color: var(--accent-2);
      }

      .diagnostics-card .lens-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }

      .lens-chip {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .lens-chip.on {
        color: var(--accent-2);
        border-color: var(--accent-2);
      }

      .diag .lens-badge {
        flex-shrink: 0;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }

      .diag-jump {
        cursor: pointer;

      .diag-jump:hover {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 4px;
      }

      .error {
        background: rgba(229, 83, 75, 0.12);
        border: 1px solid var(--danger);
        color: #f0a9a4;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        font-size: 13px;
        word-break: break-word;
      }

      .legend ul {
        list-style: none;
        margin: 0 0 8px;
        padding: 0;
      }

      .legend li {
        display: flex;

        padding: 3px 0;
        color: var(--muted);

      .dot {
        width: 12px;

      .dot.method {

        border-top: 1px solid var(--border);

        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
    <script>
      (function () {
        var LS_EX = "livewalk-panel-explorer-w";
        var LS_SIDE = "livewalk-panel-side-w";
        var MIN_EX = 200;
        var MAX_EX = 560;
        var DEF_EX = 320;
        var MIN_SIDE = 260;
        var MAX_SIDE = 640;
        var DEF_SIDE = 380;

        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }

        function read(key, def, lo, hi) {
          var raw = localStorage.getItem(key);
          var n = raw ? parseFloat(raw) : def;
          return clamp(Number.isFinite(n) ? n : def, lo, hi);
        }

        function setVar(name, px) {
          document.documentElement.style.setProperty(name, px + "px");
        }

        function loadSaved() {
          setVar("--explorer-w", read(LS_EX, DEF_EX, MIN_EX, MAX_EX));
          setVar("--side-w", read(LS_SIDE, DEF_SIDE, MIN_SIDE, MAX_SIDE));
        }

        function notifyLayout() {
          window.dispatchEvent(new Event("resize"));
        }

        function panelWidth(sel, fallback) {
          var el = document.querySelector(sel);
          return el && el.clientWidth ? el.clientWidth : fallback;
        }

        function startDrag(splitter, kind) {
          splitter.addEventListener("mousedown", function (ev) {
            ev.preventDefault();
            var body = document.querySelector(".body");
            if (!body) return;
            var startX = ev.clientX;
            var startEx = panelWidth(".explorer", DEF_EX);
            var startSide = panelWidth(".side", DEF_SIDE);
            body.classList.add("panel-resizing");
            splitter.classList.add("active");

            function onMove(ev) {
              var dx = ev.clientX - startX;
              if (kind === "explorer") {
                setVar("--explorer-w", clamp(startEx + dx, MIN_EX, MAX_EX));
              } else {
                setVar("--side-w", clamp(startSide - dx, MIN_SIDE, MAX_SIDE));
              }
              notifyLayout();
            }

            function onUp() {
              window.removeEventListener("mousemove", onMove);
              window.removeEventListener("mouseup", onUp);
              body.classList.remove("panel-resizing");
              splitter.classList.remove("active");
              localStorage.setItem(LS_EX, String(panelWidth(".explorer", DEF_EX)));
              localStorage.setItem(LS_SIDE, String(panelWidth(".side", DEF_SIDE)));
              notifyLayout();
            }

            window.addEventListener("mousemove", onMove);
            window.addEventListener("mouseup", onUp);
          });
        }

        function wireSplitters() {
          var ex = document.querySelector(".split-explorer");
          var side = document.querySelector(".split-side");
          if (!ex || !side || ex.dataset.wired) return false;
          ex.dataset.wired = "1";
          side.dataset.wired = "1";
          startDrag(ex, "explorer");
          startDrag(side, "side");
          return true;
        }

        loadSaved();
        if (!wireSplitters()) {
          var obs = new MutationObserver(function () {
            if (wireSplitters()) obs.disconnect();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body></body>
</html>
