[package]
name = "lcw-query"
description = "Live Code Walk: pure graph queries shared by every front end (symbol resolution, flow tracing, entry points, outline tree, node cards, reachability)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Deliberately tiny: `lcw-core` + serde only, no I/O, no GPU, no threads, so the
# same code runs in the CLI, the native viewer and the wasm webview.
[dependencies]
lcw-core = { path = "../lcw-core" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.145"
