[package]
name = "lcw-mcp"
description = "Live Code Walk: Model Context Protocol (stdio) server exposing lcw navigation queries to AI coding agents."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "lcw-mcp"
path = "src/main.rs"

[features]
semantic = ["lcw-engine/semantic"]

[dependencies]
lcw-agent = { path = "../../crates/lcw-agent" }
lcw-config = { path = "../../crates/lcw-config" }
lcw-core = { path = "../../crates/lcw-core" }
lcw-engine = { path = "../../crates/lcw-engine" }
lcw-query = { path = "../../crates/lcw-query" }
lcw-telemetry = { path = "../../crates/lcw-telemetry" }
serde_json = "1.0.151"
anyhow = "1.0.104"
