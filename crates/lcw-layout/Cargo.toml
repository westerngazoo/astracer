[package]
name = "lcw-layout"
description = "Live Code Walk: force-directed graph layout (CPU, data-parallel)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# GPU-compute layout in wgpu (Manifesto: GPU-compute as a later phase). Off by
# default so the crate stays a lean CPU dependency; enable for giant graphs
# where the O(n^2) repulsion dominates. Matches lcw-render's wgpu version.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
lcw-core = { path = "../lcw-core" }
rayon = "1.12.0"
wgpu = { version = "30.0.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }

[dev-dependencies]
# Lean setup: skip plotters/HTML reports, keep `cargo bench` support.
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "layout"
harness = false
