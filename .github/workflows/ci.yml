name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref so pushes don't pile up CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Be resilient to flaky crates.io fetches.
  CARGO_NET_RETRY: "10"
# NOTE: every cargo invocation below passes `--locked` so CI builds the
# committed Cargo.lock and fails loudly (rather than silently rewriting it) if a
# manifest and the lockfile disagree.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace lints set clippy to `warn`; CI promotes them to hard errors.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features only: the fast path never pulls `semantic`/`gpu`.
      # `apps/desktop/*` is excluded from the workspace, so `--workspace`
      # deliberately does not build the Tauri/wasm app here.
      - run: cargo test --workspace --locked

  features:
    name: features (gpu layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `lcw-layout`'s `gpu` feature (wgpu compute) has a CPU fallback, so it
      # runs green on a headless runner with no GPU adapter present.
      - run: cargo test -p lcw-layout --features gpu --locked

  semantic:
    name: features (semantic / rust-analyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Heavy job kept separate: `lcw-engine`'s `semantic` feature pulls the
      # rust-analyzer `ra_ap_*` crates, which are slow to compile. Cache
      # aggressively with a dedicated, reusable key and keep it on failure.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
          cache-on-failure: true
      # `cargo check` (not test/build): we only need it to compile, not link.
      - run: cargo check -p lcw-engine --features semantic --locked

  wasm:
    name: wasm (desktop frontend type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/frontend
      # The Leptos/wasm UI is outside the workspace (own lockfile, own build
      # flow), so nothing else here compiles it. A `cargo check` for the wasm
      # target needs no trunk, webview or GPU and catches API drift in
      # `lcw-core` / `lcw-query` / `lcw-render` that would otherwise only
      # surface when someone runs `cargo tauri dev`.
      - run: cargo check --target wasm32-unknown-unknown --locked
        working-directory: apps/desktop/frontend
